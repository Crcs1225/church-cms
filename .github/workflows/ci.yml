name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: cmd /c npm ci

      - name: Prepare environment file
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Generate Prisma client
        run: cmd /c npm run db:generate

      - name: Push Prisma schema
        run: cmd /c npm run db:push

      - name: Seed local database
        run: cmd /c npm run db:seed

      - name: Typecheck
        run: cmd /c npm run typecheck

      - name: Lint
        run: cmd /c npm run lint

      - name: Data smoke test
        run: cmd /c npm run test:data

      - name: Build
        run: cmd /c npm run build
